name: Release

# Cut a release by pushing a tag, e.g.:
#   git tag v2.1.2 && git push origin v2.1.2
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # required to create the GitHub Release

jobs:
  release:
    name: Build artifact and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: custom_components/woow_panel_frontend/package-lock.json

      # Build the panel bundle so the artifact ships ready-to-run.
      - name: Build frontend
        working-directory: custom_components/woow_panel_frontend
        run: |
          npm ci
          npm run build

      # Package the custom_components tree for manual install: a user unzips
      # this into their Home Assistant config directory. Dev-only files
      # (node_modules, build inputs, caches) are excluded.
      - name: Package custom_components
        run: |
          zip -r "woow-ha-multi-protocol-connect-${{ github.ref_name }}.zip" custom_components \
            -x '*/node_modules/*' \
            -x '*/__pycache__/*' \
            -x '*/woow_panel_frontend/src/*' \
            -x '*/woow_panel_frontend/scripts/*' \
            -x '*/woow_panel_frontend/package-lock.json' \
            -x '*/woow_panel_frontend/rollup.config.js'

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "woow-ha-multi-protocol-connect-${{ github.ref_name }}.zip" \
            --title "${{ github.ref_name }}" \
            --generate-notes
