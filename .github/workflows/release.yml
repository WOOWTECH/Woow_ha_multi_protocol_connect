name: Release

# Cut a release by pushing a tag, e.g.:
#   git tag v2.1.2 && git push origin v2.1.2
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # required to create the GitHub Release

jobs:
  release:
    name: Build artifact and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: panel_frontend/package-lock.json

      # Build and deploy the panel bundles so the packaged integrations ship
      # ready-to-run. The build workspace lives outside custom_components/, so
      # deploy copies the built bundles into each integration's frontend/.
      - name: Build and deploy frontend
        working-directory: panel_frontend
        run: |
          npm ci
          npm run build:deploy

      # Package the custom_components tree for manual install: a user unzips
      # this into their Home Assistant config directory. The build workspace
      # (panel_frontend/) lives outside custom_components/ and is excluded by
      # construction; only Python caches need pruning.
      - name: Package custom_components
        run: |
          zip -r "woow-ha-multi-protocol-connect-${{ github.ref_name }}.zip" custom_components \
            -x '*/__pycache__/*'

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "woow-ha-multi-protocol-connect-${{ github.ref_name }}.zip" \
            --title "${{ github.ref_name }}" \
            --generate-notes
