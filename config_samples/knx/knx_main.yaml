    - name: "一楼大会议室面板按键3"
      comment: "F1 Conference panel - Button 3 (全关)"
      address: "0/1/12"
      type: "1byte"

    # 三楼VIP会议室面板 (F3 VIP boardroom panel)
    - name: "三楼VIP面板按键1"
      comment: "F3 VIP panel - Button 1 (VIP接待)"
