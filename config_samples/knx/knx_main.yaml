# ============================================================================
# KNX Main Configuration - Smart Office Building (智能办公楼 KNX 主配置)
# ============================================================================
# 项目: 三层办公楼宇智能控制系统
# Building: 3-story commercial office (B1 lobby + F1-F3 office floors)
# KNX System Integrator: Woow Smart Building Solutions
# ETS Project Version: 5.7.x
# 最后更新: 2026-04
#
# Group Address 分配规则 (3-level format):
#   Main Group 0:  系统功能 (System functions)
#   Main Group 1:  照明控制 (Lighting control)
#   Main Group 2:  遮阳/窗帘 (Blinds/shading)
#   Main Group 3:  暖通空调 (HVAC)
#   Main Group 4:  二进制传感器 (Binary sensors)
#   Main Group 5:  环境传感器 (Environmental sensors)
#   Main Group 6:  开关设备 (Switching devices)
#   Main Group 7:  场景控制 (Scene control)
#   Main Group 8:  气象站 (Weather station)
#   Main Group 9:  能耗监控 (Energy monitoring)
#
#   Middle Group 编码: 0=公共/系统, 1=一楼, 2=二楼, 3=三楼, 4=屋顶
#
# 注意: 所有 group address 均遵循 ETS 项目实际分配
# ============================================================================

knx:

  # --------------------------------------------------------------------------
  # KNX/IP 连接配置 (Connection Configuration)
  # --------------------------------------------------------------------------
  # 使用 KNX/IP Tunneling 连接到 Weinzierl KNX IP Interface 730
  # 网关安装在一楼弱电间 (Telecom room, Floor 1)
  tunneling:
    host: "192.168.1.10"
    port: 3671
    local_ip: "192.168.1.50"
    # route_back: true  # 如果 HA 在不同子网时启用

  # 速率限制 - 防止 KNX 总线过载
  rate_limit: 0  # 0 = 使用默认值 (20 telegrams/sec)

  # 状态更新器 - 定期读取传感器值
  state_updater: true

  # ==========================================================================
  #  照明控制 (LIGHTING CONTROL)
  # ==========================================================================
  # DPT 1.001 = 开关 (Switch)
  # DPT 3.007 = 调光控制 (Dimming control)
  # DPT 5.001 = 调光值 0-100% (Dimming value)
  # DPT 232.600 = RGB 颜色 (RGB color)
  # ==========================================================================

  light:

    # --- 一楼大堂 (Floor 1 - Lobby) ---
    - name: "一楼大堂主灯"
      comment: "F1 Lobby main ceiling lights - ABB Busch-Dimmer 6155"
      address: "1/1/0"                    # 开关 switching (DPT 1.001)
      state_address: "1/1/1"              # 开关状态反馈 switch status
      brightness_address: "1/1/2"         # 调光值 dimming value (DPT 5.001)
      brightness_state_address: "1/1/3"   # 调光状态反馈 dim status

    - name: "一楼大堂装饰灯带"
      comment: "F1 Lobby RGB LED strip - MDT AKD-0424R.02"
      address: "1/1/4"
      state_address: "1/1/5"
      brightness_address: "1/1/6"
      brightness_state_address: "1/1/7"
      color_address: "1/1/8"              # RGB 颜色 (DPT 232.600)
      color_state_address: "1/1/9"

    - name: "一楼前台接待灯"
