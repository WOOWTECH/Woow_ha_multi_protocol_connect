  # ==========================================================================
  #  数据暴露 (EXPOSE ENTITIES TO KNX BUS)
  # ==========================================================================
  # 将 Home Assistant 内部状态同步到 KNX 总线
  # 供 KNX 触摸屏和其他 KNX 设备读取
  # ==========================================================================

  expose:

    # --- 时间同步 (Time Synchronization) ---
    # KNX 总线时间由 HA 提供, 每分钟更新
    - type: "time"
      address: "0/0/0"                   # KNX 时间 (DPT 10.001)

    - type: "date"
      address: "0/0/1"                   # KNX 日期 (DPT 11.001)

    - type: "datetime"
      address: "0/0/2"                   # KNX 日期时间 (DPT 19.001)

    # --- 二进制状态暴露 (Binary State Expose) ---
    # 供 KNX 逻辑模块使用
    - type: "binary"
      entity_id: "binary_sensor.workday_sensor"
      address: "0/0/10"                  # 工作日信号 (1=工作日)

    - type: "binary"
      entity_id: "input_boolean.building_occupied"
      address: "0/0/11"                  # 大楼占用信号

    - type: "binary"
      entity_id: "input_boolean.after_hours_mode"
      address: "0/0/12"                  # 下班模式信号

    - type: "binary"
      entity_id: "input_boolean.emergency_mode"
      address: "0/0/13"                  # 紧急模式信号

    # --- 温度暴露 (Temperature Expose) ---
    - type: "temperature"
      entity_id: "weather.office_building"
      attribute: "temperature"
      address: "0/0/20"                  # HA获取的室外温度

    # --- 场景状态暴露 (Scene Status Expose) ---
    - type: "binary"
      entity_id: "input_boolean.meeting_mode_active"
      address: "0/0/30"                  # 会议模式激活状态

    - type: "binary"
      entity_id: "input_boolean.presentation_mode_active"
      address: "0/0/31"                  # 演示模式激活状态

  # ==========================================================================
  #  事件监听 (EVENT LISTENERS)
  # ==========================================================================
  # 监听 KNX 按键面板的按键事件, 用于触发 HA 自动化
  # Devices: ABB Busch-priOn, Gira Tastsensor 4
  # ==========================================================================

  event:
    # 一楼大堂按键面板 (F1 Lobby button panel)
    - name: "一楼大堂面板按键1"
      comment: "F1 Lobby panel - Button 1 (全开/全关)"
