  # ===========================================================================
  # 诊断与监控 (Diagnostics & Monitoring)
  # ===========================================================================
  diagnostics:
    artpoll_enabled: true                 # 启用 ArtPoll 设备发现
    artpoll_interval_s: 10                # ArtPoll 发送间隔
    node_timeout_s: 30                    # 节点超时判定 (seconds)
    log_level: "info"                     # debug / info / warn / error
    stats_interval_s: 60                  # 统计数据上报间隔
    health_check:
      enabled: true
      interval_s: 15
      alert_on_node_loss: true            # 节点掉线时告警
      alert_on_frame_drop: true           # 丢帧时告警
      frame_drop_threshold_pct: 5         # 丢帧率阈值 (%)
